baseURL = "https://h232ch.github.io/portfolio/"
title = "Sean's Tech Notes"
theme = "PaperMod"

[params]
  author = "Sean Kim"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false

  [params.homeInfoParams]
    Title = "Welcome 👋"
    Content = "Cybersecurity • Detection Engineering • SOC • Vulnerability Management • AI/ML Security"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/h232ch"

  # This tells Hugo which sections contain posts to display on homepage
  mainSections = ["posts"]

# Server configuration for local development
[server]
  port = 1313
  bind = "127.0.0.1"

# Content organization
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "dracula"
    lineNos = true

# Enable search functionality
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Configure taxonomies
[taxonomies]
  tag = "tags"
  category = "categories"
